<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задания">
<title>Задания по варианту</title>
<style>
:root {
  --bg: #f3f5f2;
  --surface: #fff;
  --text: #16211b;
  --muted: #5d6b63;
  --accent: #1f6f4a;
  --accent-text: #fff;
  --line: #d9e0db;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111815;
    --surface: #1a2420;
    --text: #e8efea;
    --muted: #9aa9a0;
    --accent: #5fc596;
    --accent-text: #0d1a13;
    --line: #2b3a33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111815;
  --surface: #1a2420;
  --text: #e8efea;
  --muted: #9aa9a0;
  --accent: #5fc596;
  --accent-text: #0d1a13;
  --line: #2b3a33;
  color-scheme: dark;
}
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
html {
  min-height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  margin: 0;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
main {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 24px 16px 36px;
}
h1 { font-size: clamp(22px, 6vw, 27px); line-height: 1.2; margin: 0 0 20px; }
label { display: block; color: var(--muted); font-size: 15px; margin-bottom: 8px; }
.row { display: flex; gap: 10px; align-items: stretch; }
input {
  flex: 1;
  width: 0;
  min-width: 0;
  min-height: 54px;
  font: inherit;
  font-size: 22px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--text);
  appearance: none;
  -webkit-appearance: none;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  min-height: 54px;
  flex: 0 0 auto;
  font: inherit;
  font-weight: 600;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-text);
  cursor: pointer;
  touch-action: manipulation;
}
button:active { opacity: .85; }
button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.err { color: #c0392b; margin: 10px 0 0; min-height: 1.4em; font-size: 15px; }
.lvl {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  margin-top: 12px;
}
.lvl h2 { font-size: 16px; margin: 0 0 8px; }
.t {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.t:first-of-type { border-top: 0; }
.f { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.n { font-size: 28px; font-weight: 700; color: var(--accent); min-width: 2ch; text-align: right; }
.note { color: var(--muted); font-size: 14px; margin-top: 18px; }
@media (max-width: 360px) {
  main { padding-left: 12px; padding-right: 12px; }
  .row { gap: 8px; }
  button { padding: 0 13px; }
  .lvl { padding: 12px 13px; }
}
</style>
</head>
<body>
<main>
  <h1>Задания по варианту</h1>
  <label for="k">Твой вариант (1–100)</label>
  <div class="row">
    <input id="k" type="number" inputmode="numeric" min="1" max="100" placeholder="№" autocomplete="off">
    <button id="go" type="button">Считать</button>
  </div>
  <div class="err" id="err" role="alert" aria-live="polite"></div>
  <div id="out" aria-live="polite"></div>
  <p class="note">a mod* b — остаток от деления, но вместо 0 получается b.</p>
</main>
<script>
"use strict";
const modS = (a, b) => {
  const r = a % b;
  return r === 0 ? b : r;
};
const levels = [
  {name:"Уровень 1",items:[["k mod* 23",k=>modS(k,23)],["(k+12) mod* 23",k=>modS(k+12,23)]]},
  {name:"Уровень 2",items:[["k mod* 9",k=>modS(k,9)],["(k+5) mod* 9",k=>modS(k+5,9)]]},
  {name:"Уровень 3",items:[["k mod* 7",k=>modS(k,7)]]},
  {name:"Уровень 4",items:[["k mod* 4",k=>modS(k,4)]]}
];
const $ = id => document.getElementById(id);
function calc() {
  const raw = $("k").value.trim();
  const k = Number(raw);
  $("out").innerHTML = "";
  if (!raw || !Number.isInteger(k) || k < 1 || k > 100) {
    $("err").textContent = "Введи целое число от 1 до 100";
    return;
  }
  $("err").textContent = "";
  $("out").innerHTML = levels.map(l =>
    `<section class="lvl"><h2>${l.name}</h2>` +
    l.items.map(([f,fn]) =>
      `<div class="t"><span class="f">${f}</span><span class="n">${fn(k)}</span></div>`
    ).join("") +
    `</section>`
  ).join("");
}
$("go").addEventListener("click", calc);
$("k").addEventListener("keydown", e => { if (e.key === "Enter") calc(); });
$("k").addEventListener("input", () => {
  if ($("k").value) calc();
  else { $("out").innerHTML = ""; $("err").textContent = ""; }
});
</script>
</body>
</html>
